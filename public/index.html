<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Internship Registration</h1>

        <form id="studentForm" novalidate>

            <input 
                type="text" 
                id="firstName" 
                placeholder="First Name"
                required
            >

            <input 
                type="text" 
                id="lastName" 
                placeholder="Last Name"
                required
            >

            <input 
                type="text" 
                id="domain" 
                placeholder="Domain"
                required
            >

            <input 
                type="tel" 
                id="whatsapp" 
                placeholder="10 Digit Phone Number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >

<input
type="email"
id="email"
placeholder="Enter Gmail ID"
pattern="[a-z0-9._%+-]+@gmail\.com$"
title="Please enter valid Gmail"
required>

            <input 
                type="number" 
                id="tenure" 
                placeholder="Tenure in Months"
                min="1"
                required
            >

            <input 
                type="date" 
                id="joiningDate" 
                required
            >
           <input
type="file"
id="excelFile"
name="excelFile"
accept=".xlsx,.xls,.csv"
>

<button
type="button"
id="uploadExcelBtn"
>
Upload Excel File
</button>
            <button type="submit" id="submitBtn">
Submit 
</button>

        </form>

        <h2 id="result"></h2>

    </div>

    <script src="script.js"></script>

</body>
</html>
