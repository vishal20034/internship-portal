<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coordinator Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #04070f;
  --surface: #090e1a;
  --surface2: #0d1525;
  --border: rgba(99,179,255,0.08);
  --border-glow: rgba(99,179,255,0.25);
  --accent: #4f9fff;
  --accent2: #7c3aed;
  --cyan: #22d3ee;
  --green: #10b981;
  --red: #f43f5e;
  --amber: #f59e0b;
  --text: #e2eaf7;
  --muted: #5a6a84;
  --font-display: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Animated grid background ── */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(79,159,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,159,255,0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: "";
  position: fixed;
  width: 700px;
  height: 700px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(79,159,255,0.06) 0%, transparent 70%);
  top: -200px;
  right: -200px;
  pointer-events: none;
  z-index: 0;
}

.page-wrap {
  position: relative;
  z-index: 1;
  padding: 28px 32px;
  max-width: 1400px;
  margin: 0 auto;
}

/* ── Top Nav ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 36px;
}

.logo-mark {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 42px;
  height: 42px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 24px rgba(79,159,255,0.35);
}

.logo-text {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: white;
}

.logo-text span {
  color: var(--accent);
}

.refresh-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  background: var(--surface);
  color: var(--accent);
  border: 1px solid var(--border-glow);
  border-radius: 10px;
  cursor: pointer;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.3px;
  transition: all 0.2s ease;
}

.refresh-btn:hover {
  background: rgba(79,159,255,0.08);
  border-color: var(--accent);
  box-shadow: 0 0 20px rgba(79,159,255,0.15);
  transform: translateY(-1px);
}

.refresh-icon {
  display: inline-block;
  font-size: 16px;
  transition: transform 0.4s ease;
}

.refresh-btn:hover .refresh-icon {
  transform: rotate(180deg);
}

/* ── Hero Banner ── */
.banner {
  position: relative;
  padding: 44px 48px;
  border-radius: 24px;
  margin-bottom: 28px;
  overflow: hidden;
  background: linear-gradient(135deg, #0a1628 0%, #0d1e3a 50%, #0a1628 100%);
  border: 1px solid var(--border-glow);
}

.banner::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, rgba(79,159,255,0.12) 0%, transparent 60%);
}

.banner-glow {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(124,58,237,0.18) 0%, transparent 65%);
  top: -150px;
  right: -100px;
  pointer-events: none;
}

.banner-accent-line {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
}

.banner-content {
  position: relative;
  z-index: 2;
}

.banner-eyebrow {
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.banner-eyebrow::before {
  content: "";
  display: inline-block;
  width: 24px;
  height: 1px;
  background: var(--accent);
}

.banner h1 {
  font-family: var(--font-display);
  font-size: clamp(36px, 5vw, 62px);
  font-weight: 800;
  letter-spacing: -2px;
  line-height: 1;
  color: white;
  margin-bottom: 14px;
}

.banner h1 span {
  background: linear-gradient(90deg, var(--accent), var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.banner p {
  font-size: 17px;
  color: rgba(226,234,247,0.65);
  font-weight: 300;
  letter-spacing: 0.2px;
}

#domainTitle {
  color: rgba(226,234,247,0.75);
}

/* ── Stats Grid ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 26px 28px;
  position: relative;
  overflow: hidden;
  transition: all 0.25s ease;
}

.stat-card:hover {
  border-color: var(--border-glow);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.stat-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--stat-color, var(--accent)), transparent);
}

.stat-card:nth-child(1) { --stat-color: var(--accent); }
.stat-card:nth-child(2) { --stat-color: var(--green); }
.stat-card:nth-child(3) { --stat-color: var(--red); }
.stat-card:nth-child(4) { --stat-color: var(--cyan); }

.stat-icon {
  font-size: 22px;
  margin-bottom: 14px;
  display: inline-block;
}

.stat-label {
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.stat-value {
  font-family: var(--font-display);
  font-size: 46px;
  font-weight: 800;
  color: var(--stat-color, var(--accent));
  letter-spacing: -2px;
  line-height: 1;
}

/* ── Notice Card ── */
.notice-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 36px;
  margin-bottom: 28px;
  position: relative;
  overflow: hidden;
}

.notice-card::after {
  content: "";
  position: absolute;
  bottom: 0;
  right: 0;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(79,159,255,0.04) 0%, transparent 70%);
  pointer-events: none;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}

.section-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  background: rgba(79,159,255,0.1);
  border: 1px solid rgba(79,159,255,0.15);
}

.section-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: white;
  letter-spacing: -0.3px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group.full {
  grid-column: 1 / -1;
}

.form-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  padding-left: 2px;
}

input, textarea {
  width: 100%;
  padding: 13px 16px;
  background: var(--surface2);
  border: 1px solid rgba(99,179,255,0.1);
  border-radius: 12px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  outline: none;
  transition: all 0.2s ease;
}

input:focus, textarea:focus {
  border-color: rgba(79,159,255,0.4);
  background: rgba(79,159,255,0.04);
  box-shadow: 0 0 0 3px rgba(79,159,255,0.06);
}

input::placeholder, textarea::placeholder {
  color: var(--muted);
  font-weight: 300;
}

textarea {
  height: 110px;
  resize: none;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.2px;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}

.btn::after {
  content: "";
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  transition: opacity 0.15s;
}

.btn:hover::after { opacity: 0.06; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), #2563eb);
  color: white;
  box-shadow: 0 4px 20px rgba(79,159,255,0.25);
}

.btn-approve {
  background: linear-gradient(135deg, #10b981, #059669);
  color: white;
  box-shadow: 0 4px 16px rgba(16,185,129,0.2);
}

.btn-reject {
  background: linear-gradient(135deg, #f43f5e, #dc2626);
  color: white;
  box-shadow: 0 4px 16px rgba(244,63,94,0.2);
}

/* ── Submission Section ── */
.submission-wrapper {
  margin-top: 8px;
}

.submission-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.submission-count {
  font-size: 13px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 5px 14px;
  border-radius: 999px;
}

/* ── Submission Cards ── */
.submission-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 28px 32px;
  margin-bottom: 18px;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

.submission-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--accent), var(--accent2));
  border-radius: 3px 0 0 3px;
  opacity: 0;
  transition: opacity 0.25s;
}

.submission-card:hover {
  border-color: var(--border-glow);
  transform: translateY(-3px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.4);
}

.submission-card:hover::before {
  opacity: 1;
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.card-employee {
  display: flex;
  align-items: center;
  gap: 14px;
}

.employee-avatar {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, rgba(79,159,255,0.2), rgba(124,58,237,0.2));
  border: 1px solid var(--border-glow);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 18px;
  color: var(--accent);
}

.employee-id {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 700;
  color: white;
  letter-spacing: -0.3px;
}

.employee-domain {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
}

/* ── Status Pill ── */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}

.status-pill::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.pending {
  background: rgba(245,158,11,0.12);
  color: var(--amber);
  border: 1px solid rgba(245,158,11,0.25);
}

.approved {
  background: rgba(16,185,129,0.1);
  color: var(--green);
  border: 1px solid rgba(16,185,129,0.25);
}

.rejected {
  background: rgba(244,63,94,0.1);
  color: var(--red);
  border: 1px solid rgba(244,63,94,0.2);
}

/* ── Info Grid ── */
.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.info-chip {
  background: var(--surface2);
  border: 1px solid rgba(99,179,255,0.07);
  border-radius: 12px;
  padding: 12px 14px;
}

.info-chip-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
}

.info-chip-value {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}

/* ── Links Row ── */
.links-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.link-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  background: var(--surface2);
  border: 1px solid rgba(79,159,255,0.12);
  border-radius: 8px;
  color: var(--accent);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
}

.link-chip:hover {
  background: rgba(79,159,255,0.1);
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(79,159,255,0.12);
}

/* ── Feedback Area ── */
.feedback-area {
  background: var(--surface2);
  border: 1px solid rgba(99,179,255,0.07);
  border-radius: 16px;
  padding: 18px;
}

.feedback-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}

.feedback-area textarea {
  background: transparent;
  border: none;
  padding: 0;
  margin-bottom: 14px;
  height: 72px;
  font-size: 14px;
  color: rgba(226,234,247,0.8);
}

.feedback-area textarea:focus {
  box-shadow: none;
  border: none;
  background: transparent;
}

.feedback-actions {
  display: flex;
  gap: 10px;
}

/* ── Empty State ── */
.empty-state {
  background: var(--surface);
  border: 1px dashed rgba(99,179,255,0.15);
  border-radius: 24px;
  padding: 60px;
  text-align: center;
}

.empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.4;
}

.empty-text {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 8px;
}

.empty-sub {
  font-size: 14px;
  color: rgba(90,106,132,0.7);
}

/* ── Divider ── */
.card-divider {
  height: 1px;
  background: rgba(99,179,255,0.07);
  margin: 20px 0;
}

/* ── Scroll animations ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

.banner { animation: fadeUp 0.5s ease both; }
.stats-grid { animation: fadeUp 0.5s 0.1s ease both; }
.notice-card { animation: fadeUp 0.5s 0.18s ease both; }
.submission-wrapper { animation: fadeUp 0.5s 0.26s ease both; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .page-wrap { padding: 16px; }
  .topbar { flex-direction: column; align-items: flex-start; gap: 14px; }
  .refresh-btn { width: 100%; justify-content: center; }
  .banner { padding: 28px 24px; }
  .form-grid { grid-template-columns: 1fr; }
  .notice-card { padding: 24px; }
  .submission-card { padding: 22px 20px; }
  .info-grid { grid-template-columns: repeat(2, 1fr); }
  .feedback-actions { flex-direction: column; }
  .btn { width: 100%; justify-content: center; }
  .links-row { flex-direction: column; }
  .card-top { flex-direction: column; }
}

</style>
</head>
<body>

<div class="page-wrap">

  <!-- Topbar -->
  <div class="topbar">
    <div class="logo-mark">
      <div class="logo-icon">🧭</div>
      <div class="logo-text">Coord<span>Hub</span></div>
    </div>
    <button class="refresh-btn" onclick="window.location.reload()">
      <span class="refresh-icon">↻</span> Refresh Data
    </button>
  </div>

  <!-- Banner -->
  <div class="banner">
    <div class="banner-accent-line"></div>
    <div class="banner-glow"></div>
    <div class="banner-content">
      <div class="banner-eyebrow">Command Center</div>
      <h1>Coordinator <span>Dashboard</span></h1>
      <p id="domainTitle">Managing submissions dynamically</p>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon">📋</div>
      <div class="stat-label">Total Submissions</div>
      <div class="stat-value" id="totalStudents">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">✅</div>
      <div class="stat-label">Approved Tasks</div>
      <div class="stat-value" id="approvedTasks">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">❌</div>
      <div class="stat-label">Rejected Tasks</div>
      <div class="stat-value" id="rejectedTasks">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🎯</div>
      <div class="stat-label">Attendance Given</div>
      <div class="stat-value" id="attendanceCount">0</div>
    </div>
  </div>

  <!-- Notice Card -->
  <div class="notice-card">
    <div class="section-header">
      <div class="section-icon">📢</div>
      <div class="section-title">Edit Meeting Notice</div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <div class="form-label">Morning Meeting</div>
        <input type="text" id="morningMeeting" placeholder="e.g. 9:00 AM" />
      </div>
      <div class="form-group">
        <div class="form-label">Evening Meeting</div>
        <input type="text" id="eveningMeeting" placeholder="e.g. 6:00 PM" />
      </div>
      <div class="form-group full">
        <div class="form-label">Google Meet Link</div>
        <input type="text" id="meetingLink" placeholder="https://meet.google.com/..." />
      </div>
      <div class="form-group full">
        <div class="form-label">Important Notice</div>
        <textarea id="importantNotice" placeholder="Write important notice here..."></textarea>
      </div>
    </div>

    <button class="btn btn-primary" onclick="updateNotice()">
      🚀 Update Notice
    </button>
  </div>

  <!-- Submissions -->
  <div class="submission-wrapper">
    <div class="submission-header">
      <div class="section-header" style="margin-bottom:0">
        <div class="section-icon">📂</div>
        <div class="section-title">Student Task Submissions</div>
      </div>
    </div>
    <div id="submissionContainer"></div>
  </div>

</div>

<script>

const coordinatorDomain = JSON.parse(sessionStorage.getItem("coordinatorDomain"));
const isLoggedIn = sessionStorage.getItem("coordinatorLoggedIn");

console.log(isLoggedIn);

if (isLoggedIn !== "true") {
  window.location.href = "coordinator-login.html";
}

document.getElementById("domainTitle").innerText = Array.isArray(coordinatorDomain)
  ? "Managing " + coordinatorDomain.join(" & ") + " submissions"
  : "Managing " + coordinatorDomain + " submissions";

function getStatusClass(status) {
  if (status === "Approved") return "approved";
  if (status === "Rejected") return "rejected";
  return "pending";
}

function getInitial(id) {
  return id ? String(id).charAt(0).toUpperCase() : "?";
}

async function updateNotice() {
  try {
    const response = await fetch("/update-notice", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        domain: Array.isArray(coordinatorDomain) ? coordinatorDomain[0] : coordinatorDomain,
        morningMeeting: document.getElementById("morningMeeting").value,
        eveningMeeting: document.getElementById("eveningMeeting").value,
        meetingLink: document.getElementById("meetingLink").value,
        importantNotice: document.getElementById("importantNotice").value
      })
    });

    const data = await response.json();

    if (data.success) {
      Swal.fire({ icon: "success", title: "Notice Updated", text: "Meeting notice updated successfully", background: "#090e1a", color: "#e2eaf7", confirmButtonColor: "#4f9fff" });
    } else {
      Swal.fire({ icon: "error", title: "Update Failed", text: "Unable to update notice", background: "#090e1a", color: "#e2eaf7", confirmButtonColor: "#f43f5e" });
    }
  } catch (error) {
    console.log(error);
    Swal.fire({ icon: "error", title: "Server Error", text: "Please try again later", background: "#090e1a", color: "#e2eaf7", confirmButtonColor: "#f43f5e" });
  }
}

async function loadSubmissions() {
  try {
    const response = await fetch("/all-submissions/" + coordinatorDomain);
    const submissions = await response.json();
    const container = document.getElementById("submissionContainer");

    if (submissions.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <div class="empty-text">No submissions yet</div>
          <div class="empty-sub">No submissions found for ${coordinatorDomain}</div>
        </div>`;
      return;
    }

    document.getElementById("totalStudents").innerText = submissions.length;
    document.getElementById("approvedTasks").innerText = submissions.filter(s => s.status === "Approved").length;
    document.getElementById("rejectedTasks").innerText = submissions.filter(s => s.status === "Rejected").length;
    document.getElementById("attendanceCount").innerText = submissions.filter(s => s.attendanceGiven).length;

    container.innerHTML = submissions.map(sub => `
      <div class="submission-card">

        <div class="card-top">
          <div class="card-employee">
            <div class="employee-avatar">${getInitial(sub.employeeId)}</div>
            <div>
              <div class="employee-id">${sub.employeeId}</div>
              <div class="employee-domain">${sub.domain}</div>
            </div>
          </div>
          <div class="status-pill ${getStatusClass(sub.status)}">${sub.status}</div>
        </div>

        <div class="info-grid">
          <div class="info-chip">
            <div class="info-chip-label">Task</div>
            <div class="info-chip-value">${sub.task || "Submitted Task"}</div>
          </div>
          <div class="info-chip">
            <div class="info-chip-label">Attendance</div>
            <div class="info-chip-value">${sub.attendanceGiven ? "✅ Given" : "❌ Not Given"}</div>
          </div>
          <div class="info-chip">
            <div class="info-chip-label">Attendance Count</div>
            <div class="info-chip-value">${sub.attendanceCount || 0}</div>
          </div>
          <div class="info-chip">
            <div class="info-chip-label">Tasks Completed</div>
            <div class="info-chip-value">${sub.tasksCompleted || 0}</div>
          </div>
          <div class="info-chip">
            <div class="info-chip-label">Meetings Joined</div>
            <div class="info-chip-value">${sub.meetingsJoined || 0}</div>
          </div>
          <div class="info-chip">
            <div class="info-chip-label">Performance</div>
            <div class="info-chip-value">${sub.performance || "B"}</div>
          </div>
        </div>

        <div class="links-row">
          <a class="link-chip" href="${sub.githubLink || '#'}" target="_blank">🔗 GitHub</a>
          <a class="link-chip" href="${sub.image || '#'}" target="_blank">🖼 Screenshot</a>
          <a class="link-chip" href="${sub.pdf || '#'}" target="_blank">📄 PDF</a>
        </div>

        <div class="feedback-area">
          <div class="feedback-label">Feedback</div>
          <textarea id="feedback-${sub._id}" placeholder="Write feedback for this submission...">${sub.feedback || ""}</textarea>
          <div class="feedback-actions">
            <button class="btn btn-approve" onclick="updateStatus('${sub._id}', 'Approved')">✅ Approve</button>
            <button class="btn btn-reject" onclick="updateStatus('${sub._id}', 'Rejected')">❌ Reject</button>
          </div>
        </div>

      </div>
    `).join('');

  } catch (error) {
    console.log(error);
  }
}

async function updateStatus(id, status) {
  try {
    const feedback = document.getElementById("feedback-" + id).value;

    const response = await fetch("/update-status", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, status, feedback, domain: coordinatorDomain })
    });

    const data = await response.json();

    if (data.success) {
      Swal.fire({ icon: "success", title: "Task Updated", text: "Student task status updated successfully 🚀", background: "#090e1a", color: "#e2eaf7", confirmButtonColor: "#4f9fff" });
      loadSubmissions();
    } else {
      Swal.fire({ icon: "error", title: "Update Failed", text: "Unable to update task status", background: "#090e1a", color: "#e2eaf7", confirmButtonColor: "#f43f5e" });
    }
  } catch (error) {
    console.log(error);
    Swal.fire({ icon: "warning", title: "Server Error", text: "Please try again later", background: "#090e1a", color: "#e2eaf7", confirmButtonColor: "#f59e0b" });
  }
}

loadSubmissions();

</script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
